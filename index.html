<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#1a0b2e" />
    <meta
      name="description"
      content="تست سرعت اینترنت با سرورهای جهانی Vultr - Mirza Ping"
    />
    <title>Mirza Ping - Internet Speed Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --primary: #8b5cf6;
        --secondary: #6366f1;
        --accent: #a855f7;
        --bg-dark: #1a0b2e;
        --bg-mid: #2d1b4e;
        --bg-light: #1e0936;
      }

      body {
        font-family:
          "Vazirmatn",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(
          135deg,
          var(--bg-dark) 0%,
          var(--bg-mid) 50%,
          var(--bg-light) 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        padding: 10px;
      }

      .container {
        width: 100%;
        max-width: 1000px;
        padding: 20px;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: clamp(20px, 5vw, 50px);
        box-shadow: 0 8px 32px 0 rgba(138, 43, 226, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .header {
        text-align: center;
        margin-bottom: clamp(20px, 5vw, 40px);
      }

      .logo {
        font-size: clamp(1.8em, 6vw, 3em);
        font-weight: 700;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 50%,
          var(--accent) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.7);
        font-size: clamp(0.9em, 3vw, 1.1em);
        font-weight: 300;
        line-height: 1.5;
      }

      .lang-switch {
        position: absolute;
        top: 15px;
        left: 15px;
        display: flex;
        gap: 8px;
        z-index: 10;
      }

      .lang-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.7);
        padding: 6px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-family: "Vazirmatn", sans-serif;
        font-size: 0.85em;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        touch-action: manipulation;
      }

      .lang-btn:hover,
      .lang-btn.active {
        background: rgba(139, 92, 246, 0.3);
        border-color: rgba(139, 92, 246, 0.5);
        color: white;
      }

      .server-selector {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: clamp(15px, 4vw, 25px);
        margin-bottom: clamp(20px, 5vw, 30px);
      }

      .selector-title {
        color: rgba(255, 255, 255, 0.8);
        font-size: clamp(0.9em, 3vw, 1.1em);
        margin-bottom: 15px;
        font-weight: 500;
      }

      .continent-group {
        margin-bottom: 15px;
      }

      .continent-title {
        color: rgba(255, 255, 255, 0.7);
        font-size: clamp(0.85em, 2.5vw, 0.95em);
        margin-bottom: 10px;
        font-weight: 500;
        padding-bottom: 5px;
        border-bottom: 1px solid rgba(139, 92, 246, 0.3);
      }

      .server-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .server-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.7);
        padding: 8px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-family: "Vazirmatn", sans-serif;
        font-size: clamp(0.8em, 2.5vw, 0.9em);
        transition: all 0.3s ease;
        touch-action: manipulation;
      }

      .server-btn:hover,
      .server-btn.selected {
        background: rgba(139, 92, 246, 0.25);
        border-color: rgba(139, 92, 246, 0.5);
        color: white;
        transform: translateY(-2px);
      }

      .server-btn.selected {
        background: rgba(139, 92, 246, 0.4);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(12px, 3vw, 20px);
        margin-bottom: clamp(20px, 5vw, 40px);
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: clamp(15px, 4vw, 25px);
        text-align: center;
        transition: transform 0.2s ease;
      }

      .stat-card:active {
        transform: scale(0.98);
      }

      .stat-label {
        color: rgba(255, 255, 255, 0.6);
        font-size: clamp(0.8em, 2.5vw, 0.9em);
        margin-bottom: 8px;
        font-weight: 500;
      }

      .stat-value {
        color: #fff;
        font-size: clamp(1.8em, 6vw, 2.5em);
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.2;
      }

      .stat-unit {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.5em;
        font-weight: 400;
        display: inline-block;
        margin-left: 2px;
      }

      .chart-container {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: clamp(15px, 4vw, 30px);
        margin-bottom: clamp(15px, 4vw, 30px);
        height: clamp(200px, 40vw, 300px);
      }

      .chart-title {
        color: rgba(255, 255, 255, 0.8);
        font-size: clamp(0.9em, 3vw, 1.1em);
        margin-bottom: 15px;
        text-align: center;
        font-weight: 500;
      }

      #speedChart {
        width: 100%;
        height: calc(100% - 35px);
      }

      .start-btn {
        width: 100%;
        padding: clamp(15px, 4vw, 20px);
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 50%,
          var(--accent) 100%
        );
        border: none;
        border-radius: 15px;
        color: white;
        font-size: clamp(1em, 4vw, 1.3em);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: "Vazirmatn", sans-serif;
        box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        touch-action: manipulation;
      }

      .start-btn:active {
        transform: scale(0.98);
      }

      .start-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .status {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 15px;
        font-size: clamp(0.9em, 3vw, 1.1em);
        min-height: 30px;
      }

      .loading {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 3px solid rgba(139, 92, 246, 0.3);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-left: 8px;
        vertical-align: middle;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .server-info {
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        font-size: clamp(0.8em, 2.5vw, 0.9em);
        margin-top: 15px;
      }

      @media (max-width: 640px) {
        body {
          padding: 5px;
        }

        .container {
          padding: 10px;
        }

        .glass-card {
          border-radius: 20px;
        }

        .stats-grid {
          grid-template-columns: repeat(3, 1fr);
        }

        .lang-switch {
          top: 10px;
          left: 10px;
          gap: 6px;
        }

        .lang-btn {
          padding: 5px 12px;
          font-size: 0.8em;
        }

        .server-btn {
          padding: 6px 12px;
          font-size: 0.75em;
        }
      }

      @media (min-width: 641px) and (max-width: 1024px) {
        .stats-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      [dir="ltr"] .lang-switch {
        left: auto;
        right: 15px;
      }

      [dir="ltr"] .stat-unit {
        margin-left: 0;
        margin-right: 2px;
      }

      [dir="ltr"] .loading {
        margin-left: 0;
        margin-right: 8px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="lang-switch">
        <button
          class="lang-btn active"
          onclick="changeLang('fa')"
          data-lang="fa"
          aria-label="فارسی"
        >
          فارسی
        </button>
        <button
          class="lang-btn"
          onclick="changeLang('en')"
          data-lang="en"
          aria-label="English"
        >
          English
        </button>
      </div>

      <div class="glass-card">
        <div class="header">
          <div class="logo" data-text="logo">Mirza Ping</div>
          <div class="subtitle" data-text="subtitle">
            تست سرعت اینترنت با سرورهای جهانی Vultr
          </div>
        </div>

        <div class="server-selector">
          <div class="selector-title" data-text="selectServer">
            انتخاب سرور تست
          </div>

          <div class="continent-group">
            <div class="continent-title" data-text="europe">🌍 اروپا</div>
            <div class="server-buttons">
              <button
                class="server-btn"
                onclick="selectServer('germany')"
                data-server="germany"
                data-text-btn="germany"
              >
                آلمان
              </button>
              <button
                class="server-btn"
                onclick="selectServer('netherlands')"
                data-server="netherlands"
                data-text-btn="netherlands"
              >
                هلند
              </button>
              <button
                class="server-btn"
                onclick="selectServer('uk')"
                data-server="uk"
                data-text-btn="uk"
              >
                انگلستان
              </button>
              <button
                class="server-btn"
                onclick="selectServer('sweden')"
                data-server="sweden"
                data-text-btn="sweden"
              >
                سوئد
              </button>
              <button
                class="server-btn"
                onclick="selectServer('poland')"
                data-server="poland"
                data-text-btn="poland"
              >
                لهستان
              </button>
            </div>
          </div>

          <div class="continent-group">
            <div class="continent-title" data-text="asia">🌏 آسیا</div>
            <div class="server-buttons">
              <button
                class="server-btn"
                onclick="selectServer('india')"
                data-server="india"
                data-text-btn="india"
              >
                هند
              </button>
              <button
                class="server-btn"
                onclick="selectServer('japan')"
                data-server="japan"
                data-text-btn="japan"
              >
                ژاپن
              </button>
              <button
                class="server-btn"
                onclick="selectServer('korea')"
                data-server="korea"
                data-text-btn="korea"
              >
                کره جنوبی
              </button>
              <button
                class="server-btn"
                onclick="selectServer('singapore')"
                data-server="singapore"
                data-text-btn="singapore"
              >
                سنگاپور
              </button>
            </div>
          </div>

          <div class="continent-group">
            <div class="continent-title" data-text="middleEast">
              🏜️ خاورمیانه
            </div>
            <div class="server-buttons">
              <button
                class="server-btn selected"
                onclick="selectServer('israel')"
                data-server="israel"
                data-text-btn="israel"
              >
                اسرائیل
              </button>
            </div>
          </div>

          <div class="continent-group">
            <div class="continent-title" data-text="americas">
              🌎 قاره آمریکا
            </div>
            <div class="server-buttons">
              <button
                class="server-btn"
                onclick="selectServer('usa')"
                data-server="usa"
                data-text-btn="usa"
              >
                ایالات متحده
              </button>
              <button
                class="server-btn"
                onclick="selectServer('canada')"
                data-server="canada"
                data-text-btn="canada"
              >
                کانادا
              </button>
              <button
                class="server-btn"
                onclick="selectServer('brazil')"
                data-server="brazil"
                data-text-btn="brazil"
              >
                برزیل
              </button>
            </div>
          </div>

          <div class="continent-group">
            <div class="continent-title" data-text="africa">🌍 آفریقا</div>
            <div class="server-buttons">
              <button
                class="server-btn"
                onclick="selectServer('southafrica')"
                data-server="southafrica"
                data-text-btn="southafrica"
              >
                آفریقای جنوبی
              </button>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label" data-text="ping">پینگ</div>
            <div class="stat-value">
              <span id="pingValue">-</span>
              <span class="stat-unit">ms</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label" data-text="jitter">جیتر</div>
            <div class="stat-value">
              <span id="jitterValue">-</span>
              <span class="stat-unit">ms</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label" data-text="download">دانلود</div>
            <div class="stat-value">
              <span id="downloadValue">-</span>
              <span class="stat-unit">Mbps</span>
            </div>
          </div>
        </div>

        <div class="chart-container">
          <div class="chart-title" data-text="chartTitle">
            نمودار تغییرات سرعت دانلود
          </div>
          <canvas id="speedChart"></canvas>
        </div>

        <button
          class="start-btn"
          id="startBtn"
          onclick="startTest()"
          data-text="startBtn"
          aria-label="شروع تست"
        >
          شروع تست
        </button>

        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="server-info" id="serverInfo" data-text="serverInfo">
          آماده برای تست با سرور اسرائیل
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
      const translations = {
        fa: {
          logo: "Mirza Ping",
          subtitle: "تست سرعت اینترنت با سرورهای جهانی Vultr",
          selectServer: "انتخاب سرور تست",
          europe: "🌍 اروپا",
          asia: "🌏 آسیا",
          middleEast: "🏜️ خاورمیانه",
          americas: "🌎 قاره آمریکا",
          africa: "🌍 آفریقا",
          germany: "آلمان",
          netherlands: "هلند",
          uk: "انگلستان",
          sweden: "سوئد",
          poland: "لهستان",
          india: "هند",
          japan: "ژاپن",
          korea: "کره جنوبی",
          singapore: "سنگاپور",
          israel: "اسرائیل",
          usa: "ایالات متحده",
          canada: "کانادا",
          brazil: "برزیل",
          southafrica: "آفریقای جنوبی",
          ping: "پینگ",
          jitter: "جیتر",
          download: "دانلود",
          chartTitle: "نمودار تغییرات سرعت دانلود",
          startBtn: "شروع تست",
          serverInfo: "آماده برای تست با سرور ",
          testing: "در حال تست...",
          testingPing: "در حال تست پینگ...",
          testingDownload: "در حال تست دانلود (چند نخی)...",
          completed: "تست با موفقیت انجام شد!",
          error: "خطا در انجام تست",
        },
        en: {
          logo: "Mirza Ping",
          subtitle: "Internet Speed Test with Vultr Global Servers",
          selectServer: "Select Test Server",
          europe: "🌍 Europe",
          asia: "🌏 Asia",
          middleEast: "🏜️ Middle East",
          americas: "🌎 Americas",
          africa: "🌍 Africa",
          germany: "Germany",
          netherlands: "Netherlands",
          uk: "United Kingdom",
          sweden: "Sweden",
          poland: "Poland",
          india: "India",
          japan: "Japan",
          korea: "South Korea",
          singapore: "Singapore",
          israel: "Israel",
          usa: "United States",
          canada: "Canada",
          brazil: "Brazil",
          southafrica: "South Africa",
          ping: "Ping",
          jitter: "Jitter",
          download: "Download",
          chartTitle: "Download Speed Variation Chart",
          startBtn: "Start Test",
          serverInfo: "Ready to test with ",
          testing: "Testing...",
          testingPing: "Testing ping...",
          testingDownload: "Testing download (multi-threaded)...",
          completed: "Test completed successfully!",
          error: "Error during test",
        },
      };

      const servers = {
        germany: {
          url: "https://fra-de-ping.vultr.com/vultr.com.100MB.bin",
          ping: "https://fra-de-ping.vultr.com/",
        },

        },
        poland: {
          url: "https://waw-pl-ping.vultr.com/vultr.com.100MB.bin",
          ping: "https://waw-pl-ping.vultr.com/",
        },
        usa: {
          url: "https://lax-ca-us-ping.vultr.com/vultr.com.100MB.bin",
          ping: "https://lax-ca-us-ping.vultr.com/",
        },

        },

        },
        southafrica: {
          url: "https://jnb-za-ping.vultr.com/vultr.com.100MB.bin",
          ping: "https://jnb-za-ping.vultr.com/",
        },
      };

      let currentLang = "fa";
      let chart = null;
      let isTestRunning = false;
      let selectedServer = "israel";

      function changeLang(lang) {
        currentLang = lang;
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";

        document.querySelectorAll(".lang-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.lang === lang);
        });

        document.querySelectorAll("[data-text]").forEach((el) => {
          const key = el.dataset.text;
          if (translations[lang][key]) {
            el.textContent = translations[lang][key];
          }
        });

        document.querySelectorAll("[data-text-btn]").forEach((btn) => {
          const key = btn.dataset.textBtn;
          if (translations[lang][key]) {
            btn.textContent = translations[lang][key];
          }
        });

        updateServerInfo();

        if (chart) {
          chart.data.datasets[0].label = translations[lang].download;
          chart.update("none");
        }
      }

      function selectServer(server) {
        selectedServer = server;
        document.querySelectorAll(".server-btn").forEach((btn) => {
          btn.classList.remove("selected");
        });
        document
          .querySelector(`[data-server="${server}"]`)
          .classList.add("selected");
        updateServerInfo();
      }

      function updateServerInfo() {
        const serverInfo = document.getElementById("serverInfo");
        serverInfo.textContent =
          translations[currentLang].serverInfo +
          translations[currentLang][selectedServer];
      }

      function initChart() {
        const ctx = document.getElementById("speedChart").getContext("2d", {
          willReadFrequently: false,
        });

        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: translations[currentLang].download,
                data: [],
                borderColor: "#8b5cf6",
                backgroundColor: "rgba(139, 92, 246, 0.1)",
                tension: 0.4,
                fill: true,
                pointRadius: 0,
                borderWidth: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
              duration: 0,
            },
            plugins: {
              legend: {
                display: true,
                labels: {
                  color: "rgba(255, 255, 255, 0.7)",
                  font: {
                    family: "Vazirmatn",
                    size: window.innerWidth < 640 ? 10 : 12,
                  },
                  boxWidth: window.innerWidth < 640 ? 30 : 40,
                },
              },
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: {
                  color: "rgba(255, 255, 255, 0.1)",
                  drawBorder: false,
                },
                ticks: {
                  color: "rgba(255, 255, 255, 0.6)",
                  font: {
                    family: "Vazirmatn",
                    size: window.innerWidth < 640 ? 9 : 11,
                  },
                },
              },
              x: {
                grid: {
                  color: "rgba(255, 255, 255, 0.1)",
                  drawBorder: false,
                },
                ticks: {
                  color: "rgba(255, 255, 255, 0.6)",
                  font: {
                    family: "Vazirmatn",
                    size: window.innerWidth < 640 ? 9 : 11,
                  },
                  maxRotation: 0,
                },
              },
            },
            interaction: {
              intersect: false,
              mode: "index",
            },
          },
        });
      }

      async function measurePing() {
        const pingResults = [];
        const iterations = 6;
        const pingUrl = servers[selectedServer].ping;

        for (let i = 0; i < iterations; i++) {
          const start = performance.now();

          try {
            await fetch(pingUrl, {
              method: "HEAD",
              cache: "no-cache",
              mode: "no-cors",
            });
            const end = performance.now();
            pingResults.push(end - start);
          } catch (e) {
            console.error("Ping error:", e);
          }

          await new Promise((resolve) => setTimeout(resolve, 500));
        }

        if (pingResults.length === 0) return { ping: 0, jitter: 0 };

        const avgPing =
          pingResults.reduce((a, b) => a + b, 0) / pingResults.length;
        const jitter = Math.max(...pingResults) - Math.min(...pingResults);

        return {
          ping: Math.round(avgPing),
          jitter: Math.round(jitter),
        };
      }

      async function downloadThread(
        threadId,
        startTime,
        testDuration,
        sharedData,
      ) {
        const downloadUrl = servers[selectedServer].url;

        while (Date.now() - startTime < testDuration) {
          try {
            const chunkStart = performance.now();
            const response = await fetch(
              downloadUrl + "?t=" + Date.now() + "&thread=" + threadId,
              {
                cache: "no-cache",
              },
            );

            const reader = response.body.getReader();
            let receivedLength = 0;

            while (true) {
              const { done, value } = await reader.read();

              if (done) break;

              receivedLength += value.length;
              sharedData.totalBytes += value.length;

              const elapsed = Date.now() - startTime;
              if (elapsed >= testDuration) {
                reader.cancel();
                break;
              }
            }
          } catch (e) {
            console.error(`Thread ${threadId} error:`, e);
            break;
          }
        }
      }

      async function measureDownload() {
        const testDuration = 15000;
        const startTime = Date.now();
        const numThreads = 4;

        chart.data.labels = [];
        chart.data.datasets[0].data = [];

        const sharedData = { totalBytes: 0 };
        let lastBytes = 0;
        let lastTime = startTime;

        const threads = [];
        for (let i = 0; i < numThreads; i++) {
          threads.push(downloadThread(i, startTime, testDuration, sharedData));
        }

        const monitorInterval = setInterval(() => {
          const now = Date.now();
          const timeDiff = (now - lastTime) / 1000;
          const bytesDiff = sharedData.totalBytes - lastBytes;

          if (timeDiff > 0) {
            const speed = (bytesDiff * 8) / timeDiff / 1000000;

            const elapsed = Math.round((now - startTime) / 1000);
            if (!chart.data.labels.includes(elapsed + "s")) {
              chart.data.labels.push(elapsed + "s");
              chart.data.datasets[0].data.push(speed);
              chart.update("none");
            }

            document.getElementById("downloadValue").textContent =
              speed.toFixed(2);

            lastBytes = sharedData.totalBytes;
            lastTime = now;
          }
        }, 500);

        await Promise.all(threads);
        clearInterval(monitorInterval);

        const totalTime = (Date.now() - startTime) / 1000;
        const avgSpeed = (sharedData.totalBytes * 8) / totalTime / 1000000;

        return avgSpeed;
      }

      async function startTest() {
        if (isTestRunning) return;

        isTestRunning = true;
        const startBtn = document.getElementById("startBtn");
        const status = document.getElementById("status");

        startBtn.disabled = true;

        document.getElementById("pingValue").textContent = "-";
        document.getElementById("jitterValue").textContent = "-";
        document.getElementById("downloadValue").textContent = "-";

        try {
          status.innerHTML =
            translations[currentLang].testingPing +
            '<span class="loading"></span>';
          const pingResult = await measurePing();
          document.getElementById("pingValue").textContent = pingResult.ping;
          document.getElementById("jitterValue").textContent =
            pingResult.jitter;

          await new Promise((resolve) => setTimeout(resolve, 500));

          status.innerHTML =
            translations[currentLang].testingDownload +
            '<span class="loading"></span>';
          const downloadSpeed = await measureDownload();
          document.getElementById("downloadValue").textContent =
            downloadSpeed.toFixed(2);

          status.textContent = translations[currentLang].completed;
        } catch (error) {
          console.error("Test error:", error);
          status.textContent = translations[currentLang].error;
        } finally {
          startBtn.disabled = false;
          isTestRunning = false;
        }
      }

      window.addEventListener("load", () => {
        initChart();
        updateServerInfo();
      });

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (chart) {
            chart.resize();
          }
        }, 250);
      });
    </script>
  </body>
</html>
